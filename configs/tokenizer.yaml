# The grapheme (akshara) tokenizer every model in this repo shares.
#
# One Unicode grapheme cluster (regex \X) -> one token; no BPE. vocab_size in every model
# config must equal len(tokenizer), so changing this vocab invalidates every checkpoint.
target: src.telugu_ocr.tokenizer.grapheme.TeluguGraphemeTokenizer
vocab_file: src/telugu_ocr/tokenizer/assets/telugu-vocab.json
# Recorded so a vocab swap is loud rather than silent -- these are asserted by
# tests/test_checkpoint_compat.py.
expected:
  length: 2048
  pad_token_id: 2043
  bos_token_id: 2045
  eos_token_id: 2046
